<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage Society Secret Santa</title>
<meta name="description" content="Pull a name from Santa's sack. Garage Society Secret Santa.">
<meta property="og:title" content="Garage Society Secret Santa">
<meta property="og:description" content="Tap your name and find out who you're buying for.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garage-secret-santa.netlify.app/">
<meta property="og:image" content="https://garage-secret-santa.netlify.app/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1B3A44">
<link rel="icon" href="assets/garage-g.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Intro Rust";src:url("fonts/IntroRust.otf") format("opentype");font-weight:400 900;font-display:swap}
:root{
  --yellow:#FFC700;--yellow-deep:#F2BA00;--yellow-soft:#FFF8DB;
  --red:#FA4261;--red-deep:#D9304E;
  --night:#1B3A44;--night-2:#2D6373;--ink:#1F2A30;--grey:#3E4E56;--grey-60:#7B868C;
  --cream:#F6F2EA;--cream-soft:#FBF8F2;--paper:#fff;
  --display:"Intro Rust","Outfit","Helvetica Neue",system-ui,sans-serif;
  --body:"Outfit","Helvetica Neue",system-ui,sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}

#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.glow{position:fixed;inset:auto -20% -40% -20%;height:70vh;background:radial-gradient(closest-side,rgba(45,99,115,.9),transparent);z-index:0;pointer-events:none}

/* string lights */
.lights{position:relative;z-index:2;height:56px;overflow:hidden}
.lights svg{position:absolute;top:-6px;left:0;width:100%;height:60px}
.bulb{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}

.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:4px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header img{height:46px;display:block}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:999px;transform:rotate(3deg)}

.hero{text-align:center;margin:30px 0 8px}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow)}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(46px,11vw,92px);line-height:.95;margin:10px 0 0;color:var(--cream);letter-spacing:-.01em}
h1 .y{color:var(--yellow)}
.lead{font-size:19px;max-width:520px;margin:16px auto 0;color:rgba(246,242,234,.82)}

/* sack */
.sack-wrap{display:flex;justify-content:center;margin:26px 0 6px}
.sack{width:210px;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35));transform-origin:50% 90%}
.sack.wiggle{animation:wiggle .7s var(--ease)}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}}
.left{text-align:center;font-weight:700;font-size:18px}
.left b{color:var(--yellow);font-size:22px}
.meter{max-width:320px;height:10px;background:rgba(255,255,255,.12);border-radius:999px;margin:12px auto 0;overflow:hidden}
.meter span{display:block;height:100%;background:var(--yellow);border-radius:999px;transition:width .6s var(--ease)}

.panel{background:var(--cream);color:var(--grey);border-radius:24px;padding:28px;margin-top:28px;box-shadow:0 24px 60px rgba(0,0,0,.28);position:relative}
.panel h2{font-family:var(--display);font-weight:900;text-transform:uppercase;color:var(--ink);font-size:28px;line-height:1.05;margin:0 0 6px}
.panel .sub{margin:0 0 20px;color:var(--grey-60)}
.panel::before{content:"";position:absolute;top:-10px;left:50%;width:120px;height:20px;margin-left:-60px;background:var(--red);border-radius:6px;transform:rotate(-1.5deg);opacity:.95}

.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nm{position:relative;border:0;cursor:pointer;background:var(--paper);border-radius:14px;padding:16px 14px 14px;text-align:left;font-weight:800;color:var(--ink);font-size:17px;line-height:1.2;box-shadow:0 2px 0 rgba(31,42,48,.08),inset 0 0 0 1.5px rgba(62,78,86,.12);transition:transform .14s var(--ease),box-shadow .2s var(--ease)}
.nm::after{content:"";position:absolute;top:10px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 3px var(--yellow-soft)}
.nm small{display:block;font-weight:600;font-size:12px;color:var(--grey-60);margin-top:4px;letter-spacing:.02em}
.nm:hover{transform:translateY(-2px) rotate(-.6deg);box-shadow:0 10px 22px rgba(31,42,48,.14),inset 0 0 0 1.5px var(--yellow)}
.nm:active{transform:scale(.97)}
.nm.gone{cursor:default;background:transparent;color:var(--grey-60);box-shadow:inset 0 0 0 1.5px rgba(62,78,86,.18);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(250,66,97,.6)}
.nm.gone::after{background:var(--red);box-shadow:0 0 0 3px rgba(250,66,97,.18)}
.nm.gone:hover{transform:none}
.nm.gone small{text-decoration:none;display:block}

.btn{border:0;cursor:pointer;border-radius:999px;padding:13px 24px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s var(--ease),box-shadow .2s var(--ease),background .14s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-y{background:var(--yellow);color:var(--ink)}
.btn-y:hover{background:var(--yellow-deep);box-shadow:0 14px 32px rgba(255,199,0,.35)}
.btn-r{background:var(--red);color:#fff}
.btn-r:hover{background:var(--red-deep)}
.btn-ghost{background:transparent;color:var(--grey);box-shadow:inset 0 0 0 1.5px var(--grey)}
.btn-ghost:hover{background:var(--grey);color:var(--cream)}
.btn-ghost-light{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1.5px rgba(246,242,234,.5)}
.btn-ghost-light:hover{background:rgba(246,242,234,.12)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-big{font-size:18px;padding:16px 30px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.center{justify-content:center}

label.f{display:block;font-weight:700;color:var(--ink);font-size:14px;margin:18px 0 6px}
label.f span{font-weight:500;color:var(--grey-60)}
input[type=text],input[type=password],textarea{width:100%;background:var(--paper);border:1.5px solid rgba(62,78,86,.18);border-radius:12px;padding:12px 14px;outline:none;color:var(--ink)}
input:focus,textarea:focus{border-color:var(--grey);box-shadow:0 0 0 3px rgba(255,199,0,.35)}
textarea{min-height:150px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--red-deep);font-weight:700;margin-top:14px;min-height:1px}
.note{font-size:14px;color:var(--grey-60);margin-top:10px}
.linkbox{display:flex;gap:8px;margin-top:10px}
.linkbox input{font-size:14px}

/* mine banner */
.mine{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:rgba(255,199,0,.12);border:1.5px solid rgba(255,199,0,.5);border-radius:18px;padding:14px 18px;margin-top:24px}
.mine p{margin:0;font-weight:600}
.mine b{color:var(--yellow)}

/* full */
.full{text-align:center;margin-top:10px}
.full h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(36px,8vw,60px);line-height:1;color:var(--yellow);margin:8px 0 10px}
.full p{color:rgba(246,242,234,.85);font-size:18px;margin:0 auto 22px;max-width:460px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,28,34,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
.overlay.on{display:flex}
.modal{background:var(--cream);color:var(--grey);border-radius:28px;max-width:430px;width:100%;padding:32px 26px 26px;text-align:center;position:relative;overflow:hidden;animation:rise .4s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
.modal .eyebrow{color:var(--grey-60)}
.modal h3{font-family:var(--display);font-weight:900;text-transform:uppercase;color:var(--ink);font-size:34px;line-height:1.05;margin:8px 0 8px}
.modal p{margin:0 0 20px}

.gift{width:200px;height:200px;margin:6px auto 30px;position:relative;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.gift .box{position:absolute;left:22px;right:22px;bottom:0;height:128px;background:var(--red);border-radius:14px}
.gift .lid{position:absolute;left:10px;right:10px;top:46px;height:40px;background:var(--red-deep);border-radius:12px;transition:transform .55s var(--ease),opacity .4s .2s}
.gift .rv{position:absolute;left:50%;top:46px;bottom:0;width:26px;margin-left:-13px;background:var(--yellow)}
.gift .rh{position:absolute;left:22px;right:22px;top:116px;height:22px;background:var(--yellow)}
.gift .bow{position:absolute;left:50%;top:8px;width:90px;height:44px;margin-left:-45px;transition:transform .55s var(--ease),opacity .4s .2s}
.gift .bow::before,.gift .bow::after{content:"";position:absolute;bottom:0;width:44px;height:38px;border:9px solid var(--yellow);border-radius:50%/60% 60% 40% 40%}
.gift .bow::before{left:0;transform:rotate(-18deg)}
.gift .bow::after{right:0;transform:rotate(18deg)}
.gift .tap{position:absolute;left:50%;bottom:-8px;transform:translate(-50%,100%);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-60);white-space:nowrap}
.gift.pulse{animation:pulse 1.8s var(--ease) infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.gift:hover .lid{transform:translateY(-5px) rotate(-2deg)}
.gift.open .lid,.gift.open .bow{transform:translate(-30px,-90px) rotate(-26deg);opacity:0}
.reveal{display:none}
.reveal.on{display:block;animation:rise .45s var(--ease)}
.target{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,11vw,58px);line-height:1;color:var(--ink);margin:6px 0 16px;word-break:break-word}
.target span{background:var(--yellow);padding:0 .14em;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.meta span{background:var(--paper);border:1px solid rgba(62,78,86,.18);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 1.7s var(--ease) forwards}
@keyframes fall{to{transform:translateY(600px) rotate(560deg);opacity:0}}

.admin-list{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
.admin-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border-radius:10px;padding:8px 8px 8px 14px;font-weight:600;color:var(--ink)}
.admin-list .st{font-size:13px;color:var(--grey-60);font-weight:600}
.admin-list .st.done{color:#2f8f22}
.mini{border:0;background:var(--cream);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--grey)}
.mini:hover{background:var(--grey);color:var(--cream)}

footer{position:relative;z-index:1;text-align:center;padding:20px 20px 36px;font-size:13px;color:rgba(246,242,234,.55)}
footer button{background:none;border:0;color:rgba(246,242,234,.75);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.loading{text-align:center;padding:60px 0;color:rgba(246,242,234,.7);font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:all .3s var(--ease);z-index:40;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* hints + links */
.hintcard{background:var(--paper);border:1.5px dashed rgba(62,78,86,.25);border-radius:14px;padding:12px 14px;margin:0 0 18px;text-align:left}
.hintcard .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-60);display:block;margin-bottom:4px}
.hintcard .txt{font-weight:600;color:var(--ink);font-size:16px}
.hintcard.empty .txt{color:var(--grey-60);font-weight:500;font-size:15px}
.modal textarea.hint{min-height:84px;text-align:left}
.charc{font-size:12px;color:var(--grey-60);text-align:right;margin-top:4px}
.steps{display:flex;justify-content:center;gap:6px;margin:0 0 14px}
.steps i{width:22px;height:5px;border-radius:999px;background:rgba(62,78,86,.18)}
.steps i.on{background:var(--yellow)}
.shot{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--yellow-soft);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink);margin:14px 0 0}
.shot svg{flex:none;margin-top:2px}
.btn-wa{background:#25D366;color:#0b3d1f}
.btn-wa:hover{background:#1fbe5b}
.stack{display:flex;flex-direction:column;gap:10px}
.stack .btn{width:100%}
.mine .acts{display:flex;gap:8px;flex-wrap:wrap}
.mine .new{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.admin-list .who{display:flex;flex-direction:column}
.admin-list .who small{font-size:12px;color:var(--grey-60);font-weight:500}
.modal{max-height:calc(100dvh - 40px);overflow-y:auto;overscroll-behavior:contain}
a.btn{text-decoration:none}
.admin-list li{text-align:left}
.mini{white-space:nowrap}
.when{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:400px;margin:20px auto 0;background:rgba(255,199,0,.10);border:1.5px solid rgba(255,199,0,.45);border-radius:18px;padding:12px 20px 14px}
.when .lbl{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow)}
.when .val{font-weight:700;font-size:18px;line-height:1.3;color:var(--cream);text-wrap:balance}
.when .val{font-size:20px}
.meta span.d b{white-space:nowrap;font-weight:600}
.meta span.d{border-radius:14px;text-wrap:balance;line-height:1.35}
.when .sub{display:flex;flex-wrap:wrap;justify-content:center;column-gap:8px;font-weight:600;font-size:16px;color:var(--cream)}
.when .sub span{white-space:nowrap}
.when .sub i{font-style:normal;color:var(--yellow)}
.when .bud{margin-top:2px;font-size:14px;color:rgba(246,242,234,.7)}
.when .bud b{color:var(--cream);font-weight:700}
.hidden{display:none !important}
@media (max-width:560px){
  .panel{padding:22px 18px}
  .two{grid-template-columns:1fr}
  header img{height:38px}
  .sack{width:170px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>

<div class="lights" aria-hidden="true"><svg id="lights" preserveAspectRatio="none"></svg></div>

<div class="wrap">
  <header>
    <img src="assets/garage-logo-light.png" alt="Garage Society">
    <span class="tag">Ho ho ho</span>
  </header>

  <div class="hero">
    <div class="eyebrow">The Garage Society gift exchange</div>
    <h1>Secret <span class="y">Santa</span></h1>
    <div class="when hidden" id="when"></div>
    <p class="lead" id="lead">Tap your name, open your present, find out who you're buying for. Shh.</p>
  </div>

  <div class="sack-wrap" id="sackWrap">
    <svg class="sack" id="sack" viewBox="0 0 220 230" aria-hidden="true">
      <ellipse cx="110" cy="218" rx="80" ry="9" fill="rgba(0,0,0,.25)"/>
      <path d="M58 70 C30 110 22 170 40 196 C58 220 162 220 180 196 C198 170 190 110 162 70 Z" fill="#C8102E"/>
      <path d="M58 70 C30 110 22 170 40 196 C50 210 80 216 110 216 C88 200 70 160 78 70 Z" fill="#A80D27" opacity=".55"/>
      <path d="M70 72 C90 80 130 80 150 72 L156 58 C130 66 90 66 64 58 Z" fill="#8E0B21"/>
      <path d="M64 58 C78 40 92 22 110 22 C128 22 142 40 156 58 C130 66 90 66 64 58 Z" fill="#C8102E"/>
      <rect x="62" y="62" width="96" height="14" rx="7" fill="#FFC700"/>
      <circle cx="110" cy="69" r="11" fill="#F2BA00"/>
      <path d="M105 80 C100 92 96 100 92 108 M115 80 C120 92 124 100 128 108" stroke="#FFC700" stroke-width="6" stroke-linecap="round" fill="none"/>
      <g id="sackG"><image href="assets/garage-g.png" x="80" y="118" width="60" height="60"/></g>
      <text id="sackNum" x="110" y="160" text-anchor="middle" font-family="Intro Rust, Outfit, sans-serif" font-weight="900" font-size="46" fill="#FFF8DB" class="hidden"></text>
      <g fill="#fff" opacity=".9">
        <circle cx="44" cy="40" r="3"/><circle cx="180" cy="30" r="2.5"/><circle cx="196" cy="88" r="2"/><circle cx="24" cy="100" r="2"/>
      </g>
    </svg>
  </div>
  <div id="counter" class="hidden">
    <div class="left" id="leftText"></div>
    <div class="meter"><span id="meter" style="width:0"></span></div>
  </div>

  <div id="view"><div class="loading">Checking with the elves…</div></div>
</div>

<footer>
  <button type="button" id="orgBtn">Organiser</button>
</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
